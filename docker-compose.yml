services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
    restart: unless-stopped
    volumes:
      - mqdata:/mosquitto/config
      - mqdata:/mosquitto/data
      - mqdata:/mosquitto/log

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/rules:/etc/prometheus/rules:ro,z

      - promdata:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grdata:/var/lib/grafana
      - "./grafana.ini:/etc/grafana/grafana.ini"
    depends_on:
      prometheus:
        condition: service_started

  analytics:
    image: golang:1.27.1-alpine3.24
    build: "./analytics"
    environment:
      - MQTT_CLIENT_ID=nevamilk-analytics
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      mosquitto:
        condition: service_started
      prometheus:
        condition: service_started


