services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
    restart: unless-stopped
    volumes:
      - mqdata:/mosquitto/config
      - mqdata:/mosquitto/data
      - mqdata:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/rules:/etc/prometheus/rules:ro,z

      - promdata:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grdata:/var/lib/grafana
      - "./grafana.ini:/etc/grafana/grafana.ini"
    depends_on:
      prometheus:
        condition: service_started

  analytics:
    image: golang:1.27.1-alpine3.24
    build: "./analytics"
    environment:
      - MQTT_CLIENT_ID=nevamilk-analytics
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      mosquitto:
        condition: service_started
      prometheus:
        condition: service_started


  simulator:
    build:
      context: ./Sim
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      MQTT_CLIENT_ID: nevamilk-simulator
      BROKER_HOST: mosquitto
      BROKER_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mqdata:
  mqlog:
  pgdata:
  promdata:
  grdata: