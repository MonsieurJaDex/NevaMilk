services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
    restart: unless-stopped
    volumes:
      - mqdata:/mosquitto/config
      - mqdata:/mosquitto/data
      - mqdata:/mosquitto/log

  postgres:
    image: postgres:18.6-alpine3.24
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      # Добавлено :ro,z в конце для SELinux
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - promdata:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grdata:/var/lib/grafana
      - "./grafana.ini:/etc/grafana/grafana.ini"

  analytics:
    image: golang:1.27.1-alpine3.24
    build: "./analytics"
    env_file:
      - .env
    environment:
      - MQTT_CLIENT_ID=nevamilk-analytics
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started


  simulator:
    build:
      context: ./Sim
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_CLIENT_ID=nevamilk-simulator
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mqdata:
  mqlog:
  pgdata:
  promdata:
  grdata: